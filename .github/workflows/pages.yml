name: Publish GGA Ryder Cup
on:
  push:
    branches: [claude/gga-ryder-cup-app-3o1bpp]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify GGA website before publication
        run: node scripts/verify-site.cjs
      - name: Smoke-test rendered browser clubhouse
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$CHROME" ]]; then
            echo "Chrome not installed; static checks still passed."
            exit 0
          fi
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/gga-web.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=5000 --window-size=1280,900 --dump-dom http://127.0.0.1:8765/ > /tmp/gga-rendered.html 2>/tmp/gga-chrome.log
          grep -q 'data-profile="player-matthew-ydarraga"' /tmp/gga-rendered.html
          grep -q 'data-profile="player-reid-mixon"' /tmp/gga-rendered.html
          grep -q 'id="gga-home-stats"><div>' /tmp/gga-rendered.html
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=5000 --window-size=390,844 --screenshot=gga-mobile-preview.png http://127.0.0.1:8765/ >/dev/null 2>/tmp/gga-mobile-chrome.log || true
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=5000 --window-size=390,1000 --screenshot=gga-history-preview.png 'http://127.0.0.1:8765/?tab=history' >/dev/null 2>/tmp/gga-history-chrome.log || true
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=5000 --window-size=390,1000 --screenshot=gga-players-preview.png 'http://127.0.0.1:8765/?tab=players' >/dev/null 2>/tmp/gga-players-chrome.log || true
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=5000 --window-size=390,1000 --screenshot=gga-draft-preview.png 'http://127.0.0.1:8765/?tab=draft' >/dev/null 2>/tmp/gga-draft-chrome.log || true
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=5000 --window-size=1440,1000 --screenshot=gga-desktop-preview.png http://127.0.0.1:8765/ >/dev/null 2>/tmp/gga-desktop-chrome.log || true
          echo "Rendered 13-player clubhouse and homepage stats in headless Chrome."
      - name: Save phone preview from visual smoke test
        uses: actions/upload-artifact@v4
        with:
          name: gga-design-previews
          path: |
            gga-mobile-preview.png
            gga-history-preview.png
            gga-players-preview.png
            gga-draft-preview.png
            gga-desktop-preview.png
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
