name: Spark architecture checks
on:
  pull_request:
  push:
    branches: [codex/spark-only-accounts]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-package-lock
      - run: npm test
      - run: npm run test:rules
